app = 'kindness-chain'
primary_region = 'ord'
# long enough for a memo in flight to be recorded before the machine stops
kill_timeout = '25s'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  DB_PATH = '/data/chain.db'

[mounts]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  # the worker and the open event streams must keep running
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 1000
    soft_limit = 500

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
